<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        html {
            background-color: papayawhip;
        }

        div form {
            padding: 20px;
            margin: 50px;
            height: 200px;
            width: 300px;
            border-radius: 15px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.8);
            background-color: rgb(24, 113, 191);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Budget Tracker</title>
</head>

<body>
    <div align="center">
        <header>
            <h1>Personal Budget Tracker</h1>
        </header>

        <!-- Introduction Section -->
        <section>
            <h3>Welcome to Your Budget Tracker</h3>
            <p>This tracker to manage your income and expenses efficiently. Enter your details below to keep track
                of your financial activity.</p>
        </section>
        
        <!-- Add Income/Expense Section -->
        <div>
            <section>




                <form>
                    <h2 style="color: rgb(207, 25, 43);">Add New Income/Expense</h2>

                    <table>
                        <tr>

                            <td>
                                <label for="income">Income:</label>
                            </td>

                            <td> <input type="number" id="income" placeholder="Enter income amount"></td>
                        </tr>

                        <tr>

                            <td>
                                <label for="expense">Expense:</label>
                            </td>

                            <td> <input type="number" id="expense" placeholder="Enter expense amount"></td>
                        </tr>
                        <tr>

                            <td><label for="category">Category:</label></td>
                            <td><select id="category">
                                    <option>select</option>
                                    <option value="Food">Food</option>
                                    <option value="Transportation">Transportation</option>
                                    <option value="Entertainment">Entertainment</option>
                                    <option value="Housing">Housing</option>
                                    <option value="Utilities">Utilities</option>
                                    <option value="Salary">Salary</option>
                                    <option value="Other">Other</option>
                                </select></td>
                        </tr>


                        <tr>
                            <td><label for="date">Date:</label></td>
                            <td><input type="date" id="date" required></td>
                        </tr>
                    </table>
                    <br>
                    <br>
                    <button onclick="addEntry()">Add Entry</button>
                </form>
        </div>


        </section>
    </div>

    <br>
    


    <!-- Budget Summary Section -->


    <div align="center">

        <h2>Budget Summary</h2>

        <section>
            <table border="2">
                <thead>
                    <tr>
                        <th>Category</th>
                        <th>Amount</th>
                        <th>Date</th>
                        <th>Type</th>
                    </tr>
                </thead>
                <tbody id="budgetTable">
                    <!-- Entries will be added here -->
                </tbody>
            </table>
        </section>






        <script>
            // Load data from local storage when the page loads
            window.onload = function () {
                loadBudgetEntries();
            };

            function addEntry() {
                let income = document.getElementById("income").value;
                let expense = document.getElementById("expense").value;
                let category = document.getElementById("category").value;
                let date = document.getElementById("date").value;

                let amount = income ? parseFloat(income) : expense ? parseFloat(expense) : 0;
                let type = income ? "Income" : "Expense";

                if (amount === 0 || date === "") {
                    alert("Please enter a valid amount and date.");
                    return;
                }

                let entry = { category, amount, date, type };
                let budgetEntries = JSON.parse(localStorage.getItem("budgetEntries")) || [];
                budgetEntries.push(entry);
                localStorage.setItem("budgetEntries", JSON.stringify(budgetEntries));

                displayBudgetEntries();
            }

            function displayBudgetEntries() {
                let budgetEntries = JSON.parse(localStorage.getItem("budgetEntries")) || [];
                let tableBody = document.getElementById("budgetTable");
                tableBody.innerHTML = "";

                budgetEntries.forEach(entry => {
                    let row = `<tr>
                    <td>${entry.category}</td>
                    <td>${entry.amount}</td>
                    <td>${entry.date}</td>
                    <td>${entry.type}</td>
                </tr>`;
                    tableBody.innerHTML += row;
                });
            }

            function loadBudgetEntries() {
                displayBudgetEntries();
            }
        </script>
        <br>
        <br>
        
        

        <!-- Footer Section -->
        <footer>
            <p>Personal Budget Tracker - Version 1.0</p>
        </footer>
    </div>

</html>
